name: Validate arena
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npm run test
      - run: npm run build
      - run: npm audit --omit=dev
      - run: npx playwright install --with-deps chromium
      - name: Start local test server
        run: |
          npm run dev -- --hostname 127.0.0.1 > /tmp/arena.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:3000 > /dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/arena.log
          exit 1
      - run: npm run test:e2e
